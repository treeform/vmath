name: Github Actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby install -g "${{ github.event.repository.name }}/${{ github.event.repository.name }}.nimble"
      - name: Test default
        run: nim r tests/tests.nim
      - name: Test object based
        run: nim r -d:vmathObjBased tests/tests.nim
      - name: Test array based
        run: nim r -d:vmathArrayBased tests/tests.nim
      - name: Test JavaScript
        run: nim js -r tests/tests.nim
